[project]
name = "ai-trading-agent"
version = "0.1.0"
description = "Autonomous AI-powered trading agent for NQ futures via Tradovate"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "anthropic>=0.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pytz>=2024.1",
    "matplotlib>=3.9",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.38",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
